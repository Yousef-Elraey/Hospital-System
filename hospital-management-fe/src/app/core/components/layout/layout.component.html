<div class="layout d-flex flex-column min-vh-100" [attr.dir]="locale.direction" [class.rtl]="locale.isRtl">
    <nav class="navbar navbar-expand app-navbar px-3 px-lg-4 py-2 d-flex flex-nowrap align-items-center w-100">
        <a routerLink="/"
           class="navbar-brand app-brand d-flex align-items-center gap-2 text-decoration-none mb-0 flex-shrink-0">
      <span class="logo-icon app-logo-icon d-inline-flex align-items-center justify-content-center text-white">
        <app-icon name="logo" size="md"></app-icon>
      </span>
            {{ 'app.title' | translate }}
        </a>
        <div class="flex-grow-1 min-w-0" aria-hidden="true"></div>
        <div class="d-flex align-items-center gap-2 flex-shrink-0">
            <div class="btn-group btn-group-sm lang-toggle" role="group" aria-label="Language">
                <button type="button" class="btn"
                        [class.btn-primary]="locale.currentLang === 'en'"
                        [class.btn-outline-secondary]="locale.currentLang !== 'en'"
                        (click)="setLang('en')">EN
                </button>
                <button type="button" class="btn"
                        [class.btn-primary]="locale.currentLang === 'ar'"
                        [class.btn-outline-secondary]="locale.currentLang !== 'ar'"
                        (click)="setLang('ar')">ع
                </button>
            </div>
            <button type="button" class="btn btn-outline-danger btn-sm d-inline-flex align-items-center gap-1"
                    (click)="logout()">
                <span class="logout-icon d-inline-flex"><app-icon name="logout" size="sm"></app-icon></span>
                {{ 'nav.logout' | translate }}
            </button>
        </div>
    </nav>

    <div class="d-flex flex-grow-1 overflow-hidden">
        <aside class="sidebar app-sidebar flex-shrink-0 border-end">
            <nav class="sidebar-menu py-3" aria-label="Main navigation">
                <p class="sidebar-heading px-3 mb-2">{{ 'nav.menu' | translate }}</p>
                <div class="list-group list-group-flush px-2">
                    @for (item of navItems; track item.route) {
                        <a [routerLink]="item.route"
                           routerLinkActive="active"
                           [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
                           class="list-group-item list-group-item-action border-0 d-flex align-items-center gap-2 py-2 px-2"
                           [style.--nav-color]="item.color">
                            <span class="sidebar-icon d-inline-flex align-items-center justify-content-center">
                                <app-icon [name]="item.icon" size="sm"></app-icon>
                            </span>
                            <span class="sidebar-label">{{ item.labelKey | translate }}</span>
                        </a>
                    }
                </div>
            </nav>
        </aside>

        <div class="main-wrap d-flex flex-column flex-grow-1 min-w-0">
            <main class="main flex-grow-1 p-3 p-lg-4 overflow-auto">
                <div class="toolbar d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
                    <app-breadcrumb></app-breadcrumb>
                    <app-back-button></app-back-button>
                </div>
                <router-outlet></router-outlet>
            </main>
            <footer class="footer border-top py-2 px-3 mt-auto">
                <p class="footer-copyright text-center small mb-0">{{ 'footer.copyright' | translate:{year: currentYear} }}</p>
            </footer>
        </div>
    </div>
</div>
