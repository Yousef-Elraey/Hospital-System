<div class="layout d-flex min-vh-100" [attr.dir]="locale.direction" [class.rtl]="locale.isRtl" [class.sidebar-open]="sidebarOpen">
    @if (sidebarOpen) {
        <button type="button"
                class="sidebar-backdrop d-lg-none"
                (click)="closeSidebar()"
                [attr.aria-label]="'nav.closeMenu' | translate"></button>
    }

    <aside id="app-sidebar"
           class="sidebar app-sidebar flex-shrink-0"
           [class.sidebar-open]="sidebarOpen">
        <div class="sidebar-inner">
            <div class="sidebar-brand">
                <a routerLink="/"
                   class="sidebar-brand__link"
                   (click)="closeSidebar()">
                    <span class="sidebar-brand__logo d-inline-flex align-items-center justify-content-center">
                        <app-icon name="logo" size="md"></app-icon>
                    </span>
                    <span class="sidebar-brand__text">{{ 'app.title' | translate }}</span>
                </a>
            </div>

            <nav class="sidebar-menu" aria-label="Main navigation">
                <div class="sidebar-nav list-group list-group-flush">
                    @for (item of navItems; track item.route) {
                        <a [routerLink]="item.route"
                           routerLinkActive="active"
                           [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
                           class="list-group-item list-group-item-action border-0 d-flex align-items-center gap-2"
                           (click)="closeSidebar()">
                            <span class="sidebar-icon d-inline-flex align-items-center justify-content-center">
                                <app-icon [name]="item.icon" size="sm"></app-icon>
                            </span>
                            <span class="sidebar-label">{{ item.labelKey | translate }}</span>
                        </a>
                    }
                </div>
            </nav>

            <div class="sidebar-footer">
                <div ngbDropdown class="user-menu user-menu--sidebar" placement="top-end">
                    <button
                        type="button"
                        class="user-menu__trigger"
                        ngbDropdownToggle
                        [attr.aria-label]="'nav.userMenu' | translate"
                    >
                        <span class="user-menu__avatar" aria-hidden="true">
                            <i class="fa-solid fa-user-doctor"></i>
                        </span>
                        <span class="user-menu__info">
                            <span class="user-menu__name">{{ displayName }}</span>
                            <span class="user-menu__role">{{ 'nav.defaultRole' | translate }}</span>
                        </span>
                        <i class="fa-solid fa-chevron-down user-menu__chevron" aria-hidden="true"></i>
                    </button>
                    <div ngbDropdownMenu class="user-menu__dropdown">
                        <div class="user-menu__lang">
                            <span class="user-menu__lang-label">{{ 'nav.language' | translate }}</span>
                            <div class="user-menu__lang-toggle" dir="ltr" role="group" [attr.aria-label]="'nav.language' | translate">
                                <button
                                    type="button"
                                    class="user-menu__lang-btn"
                                    [class.user-menu__lang-btn--active]="locale.currentLang === 'en'"
                                    (click)="setLang('en')"
                                >EN</button>
                                <button
                                    type="button"
                                    class="user-menu__lang-btn"
                                    [class.user-menu__lang-btn--active]="locale.currentLang === 'ar'"
                                    (click)="setLang('ar')"
                                >ع</button>
                            </div>
                        </div>
                        <div class="user-menu__divider" role="separator"></div>
                        <button type="button" ngbDropdownItem class="user-menu__logout" (click)="logout()">
                            <app-icon name="logout" size="sm"></app-icon>
                            {{ 'nav.logout' | translate }}
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </aside>

    <div class="layout-main d-flex flex-column flex-grow-1 min-w-0">
        <nav class="app-navbar app-navbar--mobile d-lg-none px-3 py-2 d-flex align-items-center">
            <button type="button"
                    class="btn btn-outline-light btn-sm sidebar-toggle d-inline-flex align-items-center justify-content-center flex-shrink-0"
                    (click)="toggleSidebar()"
                    [attr.aria-expanded]="sidebarOpen"
                    aria-controls="app-sidebar"
                    [attr.aria-label]="(sidebarOpen ? 'nav.closeMenu' : 'nav.openMenu') | translate">
                <app-icon [name]="sidebarOpen ? 'close' : 'menu'" size="sm"></app-icon>
            </button>
            <span class="app-navbar--mobile-title">{{ 'app.title' | translate }}</span>
        </nav>

        <main class="main flex-grow-1 overflow-auto">
            <div class="page-content px-3 px-lg-4 py-3">
                <div class="toolbar d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
                    <app-breadcrumb></app-breadcrumb>
                    <app-back-button></app-back-button>
                </div>
                <router-outlet></router-outlet>
            </div>
        </main>

        <footer class="footer border-top py-2 px-3 mt-auto">
            <p class="footer-copyright text-center small mb-0">{{ 'footer.copyright' | translate:{year: currentYear} }}</p>
        </footer>
    </div>
</div>
