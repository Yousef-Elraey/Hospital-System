<header class="page-header" [style.--page-accent]="resolvedIconColor">
  <div class="page-header-body">
    <span class="page-header-icon" [ngStyle]="iconBgStyle">
      <app-icon [name]="iconName" size="lg"></app-icon>
    </span>
    <div class="page-header-text">
      <h1>{{ titleKey | translate }}</h1>
      @if (subtitleKey) {
        <p class="subtitle">{{ subtitleKey | translate }}</p>
      }
    </div>
  </div>
  <div class="page-header-actions">
    <ng-content select="[pageActions]"></ng-content>
  </div>
</header>
