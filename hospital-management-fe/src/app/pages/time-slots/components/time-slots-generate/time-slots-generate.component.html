<div class="list-page">
  <app-page-header
    titleKey="appointmentSlots.generateTitle"
    subtitleKey="appointmentSlots.generateHint"
    iconName="appointmentSlots"
   
  ></app-page-header>

  <div class="d-flex flex-wrap gap-2 mb-3">
    <a routerLink="/appointment-slots" class="btn btn-outline-secondary">
      <i class="fa-solid fa-arrow-left"></i>
      {{ 'appointmentSlots.backToSlots' | translate }}
    </a>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <form #generateFormRef="ngForm" (ngSubmit)="generateSlots(generateFormRef)" novalidate>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">{{ 'appointments.doctor' | translate }} <span class="text-danger">*</span></label>
            <ng-select
              class="w-100"
              [items]="doctorSelectOptions"
              bindLabel="label"
              bindValue="value"
              [(ngModel)]="generateForm.doctorId"
              name="slotDoctor"
              required
              [clearable]="false"
              [searchable]="true"
              [placeholder]="'appointments.selectDoctor' | translate"
              (ngModelChange)="onGenerateFormChange()"
            />
          </div>
          <div class="col-md-3">
            <label class="form-label">{{ 'appointmentSlots.startDate' | translate }} <span class="text-danger">*</span></label>
            <app-hospital-datepicker
              [(ngModel)]="generateForm.startDateDisplay"
              name="slotStartDate"
              required
              [minDate]="minDate"
              (dateChange)="onGenerateFormChange()"
            />
          </div>
          <div class="col-md-3">
            <label class="form-label">{{ 'appointmentSlots.endDate' | translate }} <span class="text-danger">*</span></label>
            <app-hospital-datepicker
              [(ngModel)]="generateForm.endDateDisplay"
              name="slotEndDate"
              required
              [minDate]="minDate"
              (dateChange)="onGenerateFormChange()"
            />
          </div>
          <div class="col-md-3">
            <label class="form-label">{{ 'appointmentSlots.dailyStartTime' | translate }} <span class="text-danger">*</span></label>
            <app-appointment-time-picker
              [(ngModel)]="generateForm.dailyStartTime"
              name="slotDailyStart"
              required
              (ngModelChange)="onGenerateFormChange()"
            />
          </div>
          <div class="col-md-3">
            <label class="form-label">{{ 'appointmentSlots.dailyEndTime' | translate }} <span class="text-danger">*</span></label>
            <app-appointment-time-picker
              [(ngModel)]="generateForm.dailyEndTime"
              name="slotDailyEnd"
              required
              (ngModelChange)="onGenerateFormChange()"
            />
          </div>
          <div class="col-md-3">
            <label class="form-label">{{ 'appointmentSlots.slotDuration' | translate }} <span class="text-danger">*</span></label>
            <select
              class="form-select"
              [(ngModel)]="generateForm.slotDurationMinutes"
              name="slotDuration"
              required
              (ngModelChange)="onGenerateFormChange()"
            >
              @for (d of slotDurationOptions; track d) {
                <option [ngValue]="d">{{ d }} {{ 'appointmentSlots.minutes' | translate }}</option>
              }
            </select>
          </div>
          <div class="col-md-3 d-flex align-items-end">
            <div class="form-check mb-2">
              <input
                class="form-check-input"
                type="checkbox"
                id="excludeWeekends"
                [(ngModel)]="generateForm.excludeWeekends"
                name="excludeWeekends"
                (ngModelChange)="onGenerateFormChange()"
              />
              <label class="form-check-label" for="excludeWeekends">
                {{ 'appointmentSlots.excludeWeekends' | translate }}
              </label>
            </div>
          </div>
        </div>

        @if (formError) {
          <div class="alert alert-danger mt-3 mb-0 py-2">{{ formError | translate }}</div>
        }
        @if (previewCount > 0) {
          <div class="alert alert-info mt-3 mb-0 py-2">
            {{ 'appointmentSlots.previewCount' | translate:{ count: previewCount } }}
          </div>
        }

        <div class="d-flex flex-wrap gap-2 mt-3">
          <button type="button" class="btn btn-outline-primary" (click)="previewSlots()">
            <i class="fa-solid fa-eye"></i>
            {{ 'appointmentSlots.preview' | translate }}
          </button>
          <button type="submit" class="btn btn-primary" [disabled]="generating">
            @if (generating) {
              <i class="fa-solid fa-spinner fa-spin"></i>
            } @else {
              <i class="fa-solid fa-calendar-plus"></i>
            }
            {{ 'appointmentSlots.generate' | translate }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
