<div class="list-page container-fluid px-3 px-lg-4 py-3">
  <app-page-header titleKey="patients.newPatient" subtitleKey="patients.subtitle" iconName="patients"></app-page-header>
  <div class="card form-card">
    <form #formRef="ngForm" (ngSubmit)="save(formRef)">
      <app-patient-form-fields
        [model]="model"
        [(dobDateStr)]="dobDateStr"
        [submitted]="formRef.submitted"
      />
      <div class="d-flex flex-wrap gap-2 mt-3">
        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> {{ 'common.save' | translate }}</button>
        <button type="button" class="btn btn-outline-secondary" (click)="cancel()"><i class="fa-solid fa-xmark"></i> {{ 'common.cancel' | translate }}</button>
      </div>
    </form>
  </div>
</div>
