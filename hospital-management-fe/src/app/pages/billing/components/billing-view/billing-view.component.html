<div class="list-page container-fluid px-3 px-lg-4 py-3">
  <app-page-header titleKey="billing.viewBilling" subtitleKey="billing.subtitle" iconName="billing"></app-page-header>
  @if (loading) {
    <p class="list-loading"><i class="fa-solid fa-spinner fa-spin"></i> {{ 'common.loading' | translate }}</p>
  } @else if (billing) {
    <div class="card form-card">
      <dl class="view-dl">
        <dt>{{ 'appointments.patient' | translate }}</dt>
        <dd>{{ patientName(billing.patient_id) }}</dd>
        <dt>{{ 'billing.amount' | translate }}</dt>
        <dd>{{ billing.amount }}</dd>
      </dl>
      <div class="d-flex flex-wrap gap-2 mt-3">
        <a [routerLink]="['/billing', id, 'edit']" class="btn btn-primary"><i class="fa-solid fa-pen-to-square"></i> {{ 'common.edit' | translate }}</a>
        <a routerLink="/billing" class="btn btn-outline-secondary"><i class="fa-solid fa-arrow-left"></i> {{ 'common.back' | translate }}</a>
      </div>
    </div>
  }
</div>
